name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  library:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.22.2, 24.15.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Use the declared package manager
        uses: ./.github/actions/setup-npm
      - name: Install registry dependencies
        run: npm ci --ignore-scripts
      - name: Audit development and runtime dependencies
        run: npm audit --include=dev
      - name: Validate portable dependency locks
        run: npm run check:locks && npm run test:locks
      - name: Check repository contents
        run: npm run check:repository
      - name: Lint authored code and styles
        run: npm run lint
      - name: Check formatting rules
        run: npm run test:style
      - name: Build package code and declarations
        run: npm run build
      - name: Check documented APIs against declarations
        run: npm run docs:api:check && npm run docs:imports:check
      - name: Exercise local protocol servers and SDK behavior
        run: npm test
      - name: Verify all workspace packages
        run: npm run check:packages
      - name: Verify isolated SDK and CLI consumers
        run: npm run check:consumer
      - name: Execute documented language variants
        run: npm run docs:examples:check
      - name: Check production dependencies
        run: npm run audit:production

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: ./.github/actions/setup-npm
      - run: npm run docs:install
      - run: npm run audit:docs
      - run: npm run docs:build
